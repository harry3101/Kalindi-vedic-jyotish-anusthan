services:
  - type: web
    name: cosmic-navamsa-guide
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: LOVABLE_DB_MIGRATION_URL
        sync: false
    autoDeploy: true
